<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Gestión</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container login-container">
        <header>
            <h1>🔐 Iniciar Sesión</h1>
            <p class="subtitle">Sistema de Gestión de Productos</p>
        </header>

        <!-- Formulario de Login -->
        <div class="card login-card">
            <div id="error-message" class="error-message" style="display: none;"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        placeholder="Ingresa tu usuario" 
                        required 
                        autocomplete="username"
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="clave">Contraseña</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="clave" 
                            placeholder="Ingresa tu contraseña" 
                            required 
                            autocomplete="current-password"
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            id="toggle-password"
                            onclick="togglePassword()"
                            aria-label="Mostrar contraseña"
                        >
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-large">
                        🚀 Iniciar Sesión
                    </button>
                </div>
            </form>

            <div class="login-info">
                <p><strong>Usuarios de prueba:</strong></p>
                <ul>
                    <li>Usuario: <code>jorge</code> / Contraseña: <code>1234</code></li>
                    <li>Usuario: <code>max</code> / Contraseña: <code>1234</code></li>
                </ul>
            </div>
        </div>

        <div class="login-footer">
            <p>© 2024 Sistema de Gestión - CRUD con Spring Boot</p>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
