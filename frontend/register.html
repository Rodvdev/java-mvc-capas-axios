<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container login-container">
        <header>
            <h1>📝 Registro de Usuario</h1>
            <p class="subtitle">Crea tu cuenta</p>
        </header>

        <!-- Formulario de Registro -->
        <div class="card login-card">
            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="nombre">Nombre Completo *</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        placeholder="Ingresa tu nombre completo" 
                        required 
                        minlength="2"
                        maxlength="100"
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="login">Usuario *</label>
                    <input 
                        type="text" 
                        id="login" 
                        placeholder="Ej: miusuario" 
                        required 
                        minlength="3"
                        maxlength="20"
                        pattern="[a-zA-Z0-9]+"
                        title="Solo letras y números"
                    >
                    <small style="color: #666; font-size: 0.85rem;">Solo letras y números</small>
                </div>

                <div class="form-group">
                    <label for="clave">Contraseña *</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="clave" 
                            placeholder="Mínimo 4 caracteres" 
                            required 
                            minlength="4"
                            maxlength="20"
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            onclick="togglePassword('clave')"
                            aria-label="Mostrar contraseña"
                        >
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmarClave">Confirmar Contraseña *</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="confirmarClave" 
                            placeholder="Repite tu contraseña" 
                            required 
                            minlength="4"
                            maxlength="20"
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            onclick="togglePassword('confirmarClave')"
                            aria-label="Mostrar contraseña"
                        >
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-large">
                        ✅ Crear Cuenta
                    </button>
                </div>
            </form>

            <div class="login-info" style="margin-top: 20px; text-align: center;">
                <p>¿Ya tienes cuenta? <a href="login.html" style="color: #667eea; text-decoration: none;">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
